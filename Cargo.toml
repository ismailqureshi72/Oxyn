[workspace]
resolver = "3"
members = ["crates/*", "tools/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/ismailqureshi72/Oxyn"

[workspace.dependencies]
oxyn-core = { path = "crates/oxyn-core" }
oxyn-tokens = { path = "crates/oxyn-tokens" }
oxyn-registry-schema = { path = "crates/oxyn-registry-schema" }
oxyn-codegen = { path = "crates/oxyn-codegen" }

# GPUI is pinned to one Zed revision (decision 3 of the #11 spike). The same
# revision provides gpui_web for the browser build. Bump deliberately, in its own PR.
# Not used by any crate yet; oxyn-gpui starts depending on it in #15.
gpui = { git = "https://github.com/zed-industries/zed", rev = "6ceb6fee8738274589b59139df27efc191ec2231", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "6ceb6fee8738274589b59139df27efc191ec2231", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"

# Size-first profile for browser builds (see docs/spike/rust-web.md).
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
