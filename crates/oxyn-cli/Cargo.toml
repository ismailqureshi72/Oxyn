[package]
name = "oxyn-cli"
description = "The oxyn command line: add Oxyn components to a Dioxus or GPUI project (init, list, search, view, add, diff)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/oxyn-cli"
readme = "README.md"
keywords = ["cli","ui","components","dioxus","gpui"]
categories = ["command-line-utilities","development-tools","gui"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
oxyn-registry-schema.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3"
toml = "0.9"
toml_edit = "0.25"
ureq = "3"

[dev-dependencies]
oxyn-codegen.workspace = true
tempfile = "3"

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "oxyn"
path = "src/main.rs"
