[package]
name = "oxyn-codegen"
description = "Renders a component, its props and tokens to Rust source, and builds the static component registry; shared by the CLI and Studio."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
oxyn-registry-schema.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "oxyn-registry"
path = "src/bin/oxyn_registry.rs"

[lints]
workspace = true
