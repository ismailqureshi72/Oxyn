[package]
name = "oxyn-mcp"
description = "Oxyn's MCP server: lets AI coding agents (Claude Code, Cursor, Codex, Zed) browse the Oxyn registry and add components to a Dioxus or GPUI project, over stdio."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/oxyn-mcp"
readme = "README.md"
keywords = ["mcp","ai","agent","components","dioxus"]
categories = ["development-tools","gui"]

[dependencies]
oxyn-cli = { path = "../oxyn-cli", version = "0.1.0" }
oxyn-registry-schema.workspace = true
serde_json = "1"

[dev-dependencies]
oxyn-codegen.workspace = true
tempfile = "3"

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "oxyn-mcp"
path = "src/main.rs"
