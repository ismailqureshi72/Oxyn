name: Bug
description: Something is broken
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Target
      placeholder: "oxyn-gpui 0.x / oxyn-dioxus / site / studio"
