name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Oxyn Pro sources live in the private repo ismailqureshi72/oxyn-pro (CONTRIBUTING.md). Jobs that
# need them overlay it with .github/actions/pro-overlay when secrets.OXYN_PRO_TOKEN is set; fork PRs
# get no secrets and build the free set. Pushes to main set OXYN_REQUIRE_PRO=1 and fail without it.
# fmt and clippy-test cover the free (public) build; clippy-test then repeats clippy with Pro.

# Lean on purpose: no upload-artifact, no caches beyond rust-cache. Builds ship via Releases.
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99"
          components: rustfmt
      - run: cargo fmt --all --check

  clippy-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99"
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked
      - name: tokens are valid and generated outputs are fresh
        run: cargo run --locked -p oxyn-tokens-gen -- --check
      - name: wasm32 check (core and both renderers)
        run: cargo check --locked --target wasm32-unknown-unknown -p oxyn-core -p oxyn-tokens -p oxyn-registry-schema -p oxyn-codegen -p oxyn-gpui -p oxyn-dioxus
      - name: Oxyn Pro overlay (skipped without the token), then clippy and tests again
        uses: ./.github/actions/pro-overlay
        with:
          token: ${{ secrets.OXYN_PRO_TOKEN }}
          require: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && '1' || '' }}
      - name: clippy and tests with the Pro sources
        if: env.OXYN_PRO_MODE == '1'
        run: |
          cargo clippy --workspace --all-targets --locked
          cargo test --workspace --locked

  # The native GPUI example (every screen set and agent app as interactive views) is its own
  # workspace so the windowing / wgpu backends stay out of the library's lockfile. Clippy only:
  # nothing is linked or uploaded.
  gpui-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Oxyn Pro overlay (skipped without the token)
        uses: ./.github/actions/pro-overlay
        with:
          token: ${{ secrets.OXYN_PRO_TOKEN }}
          require: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && '1' || '' }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99"
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/gpui-agent-apps
      - name: system libraries for the X11 / Wayland backends
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libfreetype-dev
      - run: cargo clippy --locked --manifest-path examples/gpui-agent-apps/Cargo.toml -- -D warnings

  # The oxyn CLI and the oxyn-mcp server end to end: build the registry from this commit (no WASM),
  # then fresh Dioxus and GPUI projects each get `oxyn init` + `oxyn add` of three free components
  # (and a third project gets them through the MCP server) and must `cargo check`. oxyn-core comes from this checkout (--oxyn-path), the code from the registry.
  cli-e2e:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      OXYN_REQUIRE_PRO: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Oxyn Pro overlay (skipped without the token)
        uses: ./.github/actions/pro-overlay
        with:
          token: ${{ secrets.OXYN_PRO_TOKEN }}
          require: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && '1' || '' }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@v2
        with:
          key: cli-e2e
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - name: registry (site/public/r) from this commit
        run: node scripts/gen.mjs
        working-directory: site
      - run: cargo build --locked -p oxyn-cli -p oxyn-mcp
      - name: list, search, view; a Pro item exits 2
        run: |
          OXYN=$CARGO_TARGET_DIR/debug/oxyn; R=$PWD/site/public/r
          n=$($OXYN list --registry "$R" --tier free --json | node -e 'console.log(JSON.parse(require("fs").readFileSync(0)).length)')
          echo "$n free items"; test "$n" -ge 72 && test "$n" -le 75
          node -e 'const i=require(process.argv[1]).items.filter(x=>x.tier==="free"&&!x.installable);for(const x of i)console.log("::error::"+x.slug+": "+x.note);process.exit(i.length?1:0)' "$R/index.json"
          $OXYN search --registry "$R" approval
          $OXYN view --registry "$R" composer
          mkdir -p "$RUNNER_TEMP/pro" && cd "$RUNNER_TEMP/pro" && cargo new -q p --vcs none && cd p
          $OXYN init --registry "$R" --framework dioxus
          set +e; $OXYN add --registry "$R" memory-panel; rc=$?; set -e
          test "$rc" = 2 || { echo "::error::a Pro item must exit 2 (got $rc)"; exit 1; }
      - name: fresh Dioxus project, oxyn add composer approval-card tag-input, cargo check
        run: |
          OXYN=$CARGO_TARGET_DIR/debug/oxyn; R=$PWD/site/public/r; ROOT=$PWD
          cd "$RUNNER_TEMP" && cargo new -q dx --vcs none && cd dx
          cargo add -q dioxus@0.7 --no-default-features -F macro,html,signals,hooks
          $OXYN init --registry "$R" --oxyn-path "$ROOT"
          $OXYN add --registry "$R" composer approval-card tag-input
          printf 'mod oxyn;\n#[allow(unused_imports)]\nuse oxyn::{ApprovalCard, Composer, TagInput};\nfn main() {}\n' > src/main.rs
          cargo check
          $OXYN diff --registry "$R" composer
      - name: Pro registry against a local mock (login --token, whoami, Pro add with a Pro dependency, cargo check)
        if: env.OXYN_PRO_MODE == '1'
        run: |
          OXYN=$CARGO_TARGET_DIR/debug/oxyn; ROOT=$PWD; R=http://127.0.0.1:8787/r
          python3 scripts/pro-registry-mock.py "$PWD/site/public" 8787 & sleep 1
          export OXYN_CONFIG_DIR="$RUNNER_TEMP/oxyncfg"
          cd "$RUNNER_TEMP" && cargo new -q prodx --vcs none && cd prodx
          cargo add -q dioxus@0.7 --no-default-features -F macro,html,signals,hooks
          $OXYN init --registry "$R" --oxyn-path "$ROOT"
          set +e; $OXYN add --registry "$R" memory-panel; rc=$?; set -e
          test "$rc" = 2 || { echo "::error::a Pro item without sign-in must exit 2 (got $rc)"; exit 1; }
          $OXYN login --registry "$R" --token oxyn_e2e
          test "$(stat -c %a "$OXYN_CONFIG_DIR/credentials.toml")" = 600
          $OXYN whoami --registry "$R"
          $OXYN add --registry "$R" memory-panel activity-home
          $OXYN add --registry "$R" tag-input
          cat "$ROOT/site/public/_pro/mock.log"
          grep -q '^activity-heatmap for=activity-home counted=0$' "$ROOT/site/public/_pro/mock.log" || { echo "::error::a Pro dependency must name its parent and not count"; exit 1; }
          test "$(wc -l < "$ROOT/site/public/_pro/mock.log")" = 3 || { echo "::error::installed Pro items must not be downloaded again"; exit 1; }
          printf 'mod oxyn;\n#[allow(unused_imports)]\nuse oxyn::{ActivityHome, MemoryPanel, TagInput};\nfn main() {}\n' > src/main.rs
          cargo check
          $OXYN logout --registry "$R"
      - name: MCP server over stdio (initialize, tools/list, list/get/add), then cargo check what it added
        run: |
          OXYN=$CARGO_TARGET_DIR/debug/oxyn; R=$PWD/site/public/r; ROOT=$PWD
          (cd "$RUNNER_TEMP" && cargo new -q mcpdx --vcs none && cd mcpdx \
            && cargo add -q dioxus@0.7 --no-default-features -F macro,html,signals,hooks \
            && $OXYN init --registry "$R" --oxyn-path "$ROOT")
          OXYN_MCP_E2E_REGISTRY="$R" OXYN_MCP_E2E_PROJECT="$RUNNER_TEMP/mcpdx" cargo test --locked -p oxyn-mcp -- --nocapture
          cd "$RUNNER_TEMP/mcpdx"
          printf 'mod oxyn;\n#[allow(unused_imports)]\nuse oxyn::{ApprovalCard, Composer, TagInput};\nfn main() {}\n' > src/main.rs
          cargo check
      - name: fresh GPUI project, oxyn add button badge spinner, cargo check
        run: |
          OXYN=$CARGO_TARGET_DIR/debug/oxyn; R=$PWD/site/public/r; ROOT=$PWD
          sudo apt-get update -qq && sudo apt-get install -y -qq libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libfreetype-dev
          cd "$RUNNER_TEMP" && cargo new -q gp --vcs none && cd gp
          $OXYN init --registry "$R" --framework gpui --oxyn-path "$ROOT"
          $OXYN add --registry "$R" button badge spinner
          printf 'mod oxyn;\n#[allow(unused_imports)]\nuse oxyn::{BadgeEl, ButtonEl, SpinnerEl};\nfn main() {}\n' > src/main.rs
          cargo check

  # Site: build only (Astro + Pagefind + the live-demo WASM bundle). Never uploads artifacts.
  # Deploy runs on main only, and only once the Cloudflare secrets exist; otherwise it is skipped.
  site:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OXYN_REQUIRE_PRO: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Oxyn Pro overlay (skipped without the token)
        uses: ./.github/actions/pro-overlay
        with:
          token: ${{ secrets.OXYN_PRO_TOKEN }}
          require: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && '1' || '' }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.130
      # binaryen's wasm-opt: required by site/scripts/gen.mjs under CI (taiki-e has no binaryen).
      - name: install wasm-opt (binaryen version_133)
        env:
          BINARYEN: version_133
        run: |
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN}/binaryen-${BINARYEN}-x86_64-linux.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-${BINARYEN}/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/binaryen-${BINARYEN}/bin/wasm-opt" --version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - name: SEO checks (JSON-LD parses, canonicals, landing title/H1, robots, sitemap, llms.txt)
        run: node scripts/check-seo.mjs dist
        working-directory: site
      - name: worker unit tests (entitlements)
        run: npm test
        working-directory: site
      - name: status.csv tiers follow the Free list (site/src/lib/free-tier.json)
        run: node scripts/sync-tiers.mjs --check
        working-directory: site
      # Runs on every PR so an oversized asset fails before merge, not at deploy on main.
      # Cloudflare Workers rejects any single asset over 25 MiB; keep 1 MiB of headroom.
      - name: asset size guard (every file in site/dist under 24 MiB)
        working-directory: site
        run: |
          echo "largest files in dist/:"
          find dist -type f -printf '%s\t%p\n' | sort -rn | awk 'NR <= 10' | awk -F'\t' '{ printf "  %8.2f MiB  %s\n", $1/1048576, $2 }'
          for f in dist/wasm/*.wasm; do
            [ -f "$f" ] || continue
            raw=$(stat -c %s "$f"); gz=$(gzip -9 -c "$f" | wc -c)
            awk -v f="$f" -v r="$raw" -v g="$gz" 'BEGIN { printf "wasm %s: %.2f MiB raw, %.2f MiB gzip\n", f, r/1048576, g/1048576 }'
          done
          big=$(find dist -type f -size +24M)
          if [ -n "$big" ]; then
            echo "::error::assets over 24 MiB (Cloudflare Workers caps one asset at 25 MiB):"
            echo "$big"
            exit 1
          fi
      # Bundles site/worker/index.ts and checks wrangler.jsonc (bindings, routes) without credentials.
      - name: worker bundle check (wrangler deploy --dry-run)
        working-directory: site
        run: npx --yes wrangler@4 deploy --dry-run --outdir "$RUNNER_TEMP/worker-dry"
      # site/worker/dev.ts swaps the Access JWT check and GitHub sign-in for localhost stubs. They
      # must never be deployed: fail if either marker is in the bundle, and prove the check would see
      # them (dev.ts bundle).
      - name: dev stubs are not deployed (fake Google and GitHub sign-in)
        working-directory: site
        run: |
          for m in OXYN_DEV_GOOGLE_STUB OXYN_DEV_GITHUB_STUB fake-google.oxyn.invalid fake-github.oxyn.invalid; do
            if grep -rq "$m" "$RUNNER_TEMP/worker-dry"; then
              echo "::error::dev stub marker $m (worker/dev.ts) is in the deploy bundle"; exit 1
            fi
          done
          npx --yes wrangler@4 deploy --dry-run worker/dev.ts --outdir "$RUNNER_TEMP/worker-dev"
          for m in OXYN_DEV_GOOGLE_STUB OXYN_DEV_GITHUB_STUB fake-google.oxyn.invalid fake-github.oxyn.invalid; do
            grep -rq "$m" "$RUNNER_TEMP/worker-dev" || { echo "::error::marker check for $m is broken"; exit 1; }
          done
          echo "deploy bundle has no dev stubs"
      # Uploads the assets, the /api Worker and its D1 + R2 bindings together. D1 migrations are
      # applied separately (docs/backend.md).
      - name: deploy to Cloudflare (main, when credentials are set)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.CF_TOKEN != ''
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
