# GPUI-on-web spike. Standalone workspace: needs Zed's repo cloned beside Oxyn
# (git clone https://github.com/zed-industries/zed ../zed, tested at rev 6ceb6fe, 2026-11-12).
[workspace]

[package]
name = "oxyn-gpui-web-status-spike"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "oxyn-gpui-web-status"
path = "src/main.rs"

[dependencies]
oxyn-core-spike = { path = "../core" }
gpui = { path = "../../../zed/crates/gpui", default-features = false }
gpui_platform = { path = "../../../zed/crates/gpui_platform", default-features = false }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["console", "Location", "Window"] }
web-time = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
