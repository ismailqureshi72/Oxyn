# Throwaway spike for PR #11 (V2.6). Not the real workspace; deleted in #12.
[workspace]
resolver = "3"
members = ["core", "dioxus-status", "gpui-status"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release-native]
inherits = "release"
opt-level = 3

# xattr 0.2.3 (via gpui 0.2.2 -> gpui_http_client -> zed-async-tar) uses libc::ENOATTR,
# which current libc no longer exports on Linux. Spike-only patch; see docs/spike/rust-web.md.
[patch.crates-io]
xattr = { path = "patches/xattr" }
