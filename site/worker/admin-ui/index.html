<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Oxyn admin</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/admin/app.css">
<script src="/admin/app.js"></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="bar">
  <a class="brand" href="/" title="Back to the Oxyn site"><span class="mark" aria-hidden="true">O</span><span class="name">Oxyn</span><span class="tag">Admin</span></a>
  <div class="bar-r">
    <span class="who" id="who"></span>
    <button class="ib" id="theme" type="button" aria-label="Switch to dark theme" title="Theme">
      <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    </button>
    <button class="btn ghost" id="logout" type="button" hidden>Sign out</button>
  </div>
</header>
<nav class="tabs" id="tabs" role="tablist" aria-label="Admin sections" hidden>
  <button role="tab" id="tab-inbox" aria-controls="main" data-tab="inbox">Inbox <span class="count" id="newcount"></span></button>
  <button role="tab" id="tab-billing" aria-controls="main" data-tab="billing">Billing</button>
  <button role="tab" id="tab-admins" aria-controls="main" data-tab="admins">Admins</button>
  <button role="tab" id="tab-settings" aria-controls="main" data-tab="settings">Settings</button>
  <button role="tab" id="tab-audit" aria-controls="main" data-tab="audit">Audit log</button>
</nav>
<main id="main" tabindex="-1"><p class="muted pad">Loading…</p></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<dialog class="dlg" id="confirm" aria-labelledby="confirm-t">
  <div class="dlg-in">
    <h2 id="confirm-t"></h2>
    <p id="confirm-m"></p>
    <div class="row end"><button class="btn" type="button" id="confirm-no">Cancel</button><button class="btn danger" type="button" id="confirm-ok">Delete</button></div>
  </div>
</dialog>
<noscript><p class="pad">The admin panel needs JavaScript.</p></noscript>
</body>
</html>
