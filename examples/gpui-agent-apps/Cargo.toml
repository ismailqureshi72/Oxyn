# The six agent apps as interactive GPUI views in one native window. Its own workspace on
# purpose: the platform backends (windowing, wgpu) stay out of the library's lockfile and CI.
# Run from the repo root: cargo run --manifest-path examples/gpui-agent-apps/Cargo.toml
[package]
name = "gpui-agent-apps"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace]

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "6ceb6fee8738274589b59139df27efc191ec2231", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "6ceb6fee8738274589b59139df27efc191ec2231", default-features = false, features = ["x11", "wayland"] }
oxyn-gpui = { path = "../../crates/oxyn-gpui" }
